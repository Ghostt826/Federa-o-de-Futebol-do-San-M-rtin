<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FFSM | Clubes e Ligas</title>
<link rel="icon" type="image/png" href="ffsm.png">

<style>
  :root{
    --azul-escuro:#910b26;
    --azul-faixa:#b2082a;
    --azul-link:#c81438;
    --cinza-rodape:#4a4a4a;
    --cinza-claro:#f4f4f4;
    --borda:#e2e2e2;
    --texto:#222;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: Arial, Helvetica, sans-serif;
    color:var(--texto);
    background:#fff;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  a{text-decoration:none;color:inherit;}

  /* ===== CABEÇALHO ===== */
  #header{border-bottom:1px solid var(--borda);}
  #header-top{
    max-width:1200px;margin:0 auto;
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 20px;
  }
  #logo{display:flex;align-items:center;gap:10px;font-weight:bold;font-size:26px;color:var(--azul-escuro);}
  #logo img{height:72px;}
  #botao-tema{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--borda);background:var(--cinza-claro);color:var(--texto);width:38px;height:38px;padding:7px;border-radius:4px;cursor:pointer;}
  #botao-tema img{width:20px;height:20px;object-fit:contain;}
  #faixa-azul{background:var(--azul-faixa);height:14px;}

  /* ===== BREADCRUMB / BANNER ===== */
  #banner{max-width:1200px;margin:0 auto;padding:0 20px;}
  #banner-img{
    height:150px;border-radius:4px;
    background:linear-gradient(rgba(10,15,25,.55),rgba(10,15,25,.55)),
      repeating-linear-gradient(45deg,#1c4d2e,#1c4d2e 20px,#225a36 20px,#225a36 40px);
    margin-top:24px;
    margin-bottom:24px;
  }

  /* ===== CONTEÚDO ===== */
  #conteudo{max-width:1200px;width:100%;margin:0 auto;padding:0 20px 60px;display:flex;gap:40px;flex:1;}
  h2.titulo-pagina{font-size:30px;font-weight:400;color:var(--azul-escuro);margin:0 0 20px;}
  #coluna-esquerda{width:230px;flex-shrink:0;}
  #busca-clubes{position:relative;margin-bottom:16px;}
  #busca-clubes input{
    width:100%;padding:9px 34px 9px 12px;border:1px solid var(--borda);border-radius:4px;font-size:13px;
  }
  #busca-clubes span{position:absolute;right:10px;top:9px;opacity:.5;}
  #menu-divisoes{list-style:none;margin:0;padding:0;border-left:2px solid var(--borda);}
  #menu-divisoes li a{display:block;padding:11px 14px;font-size:14px;color:var(--texto);border-left:3px solid transparent;}
  #menu-divisoes li a:hover{background:var(--cinza-claro);}
  #menu-divisoes li a.ativa{
    background:var(--azul-escuro);color:#fff;border-left:3px solid var(--azul-faixa);font-weight:bold;
  }

  #coluna-direita{flex:1;border-left:1px solid var(--borda);padding-left:40px;}
  #lista-times{display:grid;grid-template-columns:repeat(2,1fr);gap:24px 30px;}
  .time-caixa{display:flex;align-items:center;gap:16px;padding:8px 0;}
  .time-caixa .escudo{
    width:64px;height:64px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-size:10px;color:#999;text-align:center;overflow:hidden;
  }
  .time-caixa .escudo img{width:100%;height:100%;object-fit:contain;}
  .time-caixa .nome{font-size:13px;font-weight:bold;color:var(--texto);letter-spacing:.2px;}
  .time-caixa:hover .nome{color:var(--azul-link);}

  #estado-vazio{padding:60px 20px;text-align:center;color:#888;font-size:16px;font-style:italic;}

  /* ===== RODAPÉ ===== */
  #rodape{background:var(--cinza-rodape);color:#ddd;margin-top:40px;}
  #rodape-links{
    max-width:1200px;margin:0 auto;padding:16px 20px;font-size:12px;
    display:flex;gap:10px;flex-wrap:wrap;align-items:center;
  }
  #rodape-links a{color:#ddd;}
  #rodape-links a:hover{color:#fff;}
  #rodape-links .direitos{margin-left:auto;font-weight:bold;letter-spacing:.5px;font-size:11px;}
  #rodape-baixo{background:#3a3a3a;font-size:11px;color:#aaa;}
  #rodape-baixo div{max-width:1200px;margin:0 auto;padding:10px 20px;}

  /* ===== RESPONSIVO ===== */
  @media (max-width:760px){
    #conteudo{flex-direction:column;}
    #coluna-direita{border-left:none;padding-left:0;border-top:1px solid var(--borda);padding-top:20px;}
    #lista-times{grid-template-columns:1fr;}
  }

  @media (max-width:760px){
    #header-top{flex-direction:row;gap:12px;padding:14px 16px;}
    #logo{min-width:0;}
    #botao-tema{flex:0 0 38px;}
    #conteudo{min-height:0;}
    #logo img{height:58px;}
    #banner{padding:0 14px;}
    #banner-img{height:104px;margin-top:14px;margin-bottom:18px;}
    #conteudo{padding:0 14px 40px;gap:24px;}
    #coluna-esquerda{width:auto;}
    h2.titulo-pagina{font-size:24px;margin-bottom:14px;}
    #menu-divisoes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;border-left:0;}
    #menu-divisoes li a{padding:10px 9px;border-left:0;border-radius:3px;font-size:13px;}
    #menu-divisoes li:last-child{grid-column:1 / -1;}
    #coluna-direita{padding-top:18px;}
    #lista-times{grid-template-columns:1fr;gap:8px;}
    .time-caixa{padding:10px 0;gap:12px;border-bottom:1px solid var(--borda);}
    .time-caixa .escudo{width:56px;height:56px;}
    #rodape-links{padding:14px 16px;}
    #rodape-links .direitos{width:100%;margin-left:0;margin-top:4px;}
  }

  body.tema-escuro{--cinza-claro:#2b2b2b;--borda:#454545;--texto:#f1f1f1;background:#181818;}
  body.tema-escuro #header{background:#202020;}
  body.tema-escuro #banner-img{opacity:.78;}
  body.tema-escuro #busca-clubes input{background:#242424;color:var(--texto);}
  body.tema-escuro #coluna-direita{background:#181818;}
  body.tema-escuro #estado-vazio{color:#aaa;}
  body.tema-escuro #botao-tema{background:#383838;color:#fff;}
</style>
</head>
<body>

<!-- ===================== CABEÇALHO ===================== -->
<div id="header">
  <div id="header-top">
    <a href="index.html" id="logo">
      <img src="logo-ffsm.png" alt="Logo da FFSM">
    </a>
    <button id="botao-tema" type="button" aria-label="Ativar modo escuro"><img src="assets/sun.png" alt=""></button>
  </div>
</div>
<div id="faixa-azul"></div>

<!-- ===================== BANNER / BREADCRUMB ===================== -->
<div id="banner">
  <div id="banner-img"></div>
</div>

<!-- ===================== CONTEÚDO ===================== -->
<div id="conteudo">

  <div id="coluna-esquerda">
    <h2 class="titulo-pagina">Clubes e ligas</h2>
    <div id="busca-clubes">
      <input id="txBusca" type="text" placeholder="localizar clubes" onkeyup="filtrarClubes()">
      <span>🔍</span>
    </div>
    <ul id="menu-divisoes"><!-- gerado via JS --></ul>
  </div>

  <div id="coluna-direita">
    <div id="lista-times"><!-- gerado via JS --></div>
    <div id="estado-vazio" style="display:none;">Clubes não encontrados... Volte mais tarde!</div>
  </div>

</div>

<!-- ===================== RODAPÉ ===================== -->
<div id="rodape">
  <div id="rodape-links">
    <a href="#">Ouvidoria</a>|
    <a href="#">Fale Conosco</a>|
    <a href="termos.html">Termos e Condições</a>
    <span class="direitos">FEDERAÇÃO DE FUTEBOL DO SAN MÂRTIN</span>
  </div>
</div>
<div id="rodape-baixo"><div>© FFSM — Todos os direitos reservados.</div></div>

<script>
  const botaoTema = document.querySelector('#botao-tema');
  const iconeTema = botaoTema.querySelector('img');

  function aplicarTema(tema) {
    const modoEscuro = tema === 'escuro';
    document.body.classList.toggle('tema-escuro', modoEscuro);
    iconeTema.src = modoEscuro ? 'assets/moon.png' : 'assets/sun.png';
    botaoTema.setAttribute('aria-label', modoEscuro ? 'Ativar modo claro' : 'Ativar modo escuro');
  }

  aplicarTema(localStorage.getItem('ffsm-tema') || 'claro');
  botaoTema.addEventListener('click', () => {
    const novoTema = document.body.classList.contains('tema-escuro') ? 'claro' : 'escuro';
    localStorage.setItem('ffsm-tema', novoTema);
    aplicarTema(novoTema);
  });

/* =====================================================================
   ÁREA DE EDIÇÃO — é só mexer aqui para adicionar/remover divisões e clubes
   =====================================================================
   - id: identificador único da divisão (usado internamente)
   - nome: texto exibido no menu lateral
   - clubes: lista de clubes dessa divisão (deixe [] se ainda não tiver
     nenhum, que a página mostra sozinha "Clubes não encontrados...")
       - nome: nome do clube (aparece na listagem)
       - escudo: caminho da imagem do escudo (ex: "escudos/laogas.png")
       - link: para qual página o card do clube deve levar
============================================================================ */
const divisoes = [
  {
    id: "serie-a",
    nome: "Série A",
    clubes: [
      { nome: "A.E.A. Porto Novo", escudo: "escudos/aea-porto-novo.png", link: "clubes/aea-porto-novo.html" },
      { nome: "C.A. Barra de San Diego", escudo: "escudos/ca-barra-de-san-diego.png", link: "clubes/ca-barra-de-san-diego.html" },
      { nome: "C.R. São Davi", escudo: "escudos/cr-sao-davi.png", link: "clubes/cr-sao-davi.html" },
      { nome: "C.S. Jaracas", escudo: "escudos/cs-jaracas.png", link: "clubes/cs-jaracas.html" },
      { nome: "E.C. Maripo", escudo: "escudos/ec-maripo.png", link: "clubes/ec-maripo.html" },
      { nome: "E.C. Miradense", escudo: "escudos/ec-miradense.png", link: "clubes/ec-miradense.html" },
      { nome: "S.C. Floriano", escudo: "escudos/sc-floriano.png", link: "clubes/sc-floriano.html" },
      { nome: "Cruzeiro Azul E.C.", escudo: "escudos/cruzeiro-azul-ec.png", link: "clubes/cruzeiro-azul-ec.html" },
    ]
  },
  { id: "serie-b", nome: "Série B", clubes: [
    { nome: "A.F. Lagoas", escudo: "escudos/af-lagoas.png", link: "clubes/af-lagoas.html" },
    { nome: "C.A. Porto Branco", escudo: "escudos/ca-porto-branco.png", link: "clubes/ca-porto-branco.html" },
    { nome: "C.S. Porto Venezia", escudo: "escudos/cs-porto-venezia.png", link: "clubes/cs-porto-venezia.html" },
    { nome: "São Marapo F.C.", escudo: "escudos/sao-marapo-fc.png", link: "clubes/sao-marapo-fc.html" },
    { nome: "Santa Lúcia F.C.", escudo: "escudos/santa-lucia-fc.png", link: "clubes/santa-lucia-fc.html" },
    { nome: "São Jaco F.C.", escudo: "escudos/sao-jaco-fc.png", link: "clubes/sao-jaco-fc.html" },
    { nome: "Martin E.C.", escudo: "escudos/martin-ec.png", link: "clubes/martin-ec.html" },
    { nome: "S.C. Wagner", escudo: "escudos/sc-wagner.png", link: "clubes/sc-wagner.html" },
  ]
  },
  { id: "serie-c", nome: "Série C", clubes: [] },
  { id: "liga-municipal", nome: "Liga Municipal", clubes: [
    { nome: "Liga Desportiva San-Dieguense", escudo: "ligas/Liga%20Desportiva%20San-Dieguense.png", link: "ligas-municipais/liga-desportiva-san-dieguense.html" }
  ] },
  { id: "amadores", nome: "Amadores (sem divisão)", clubes: [] },
];
/* ===================================================================== */

const divisaoInformada = new URLSearchParams(window.location.search).get("divisao");
let divisaoAtual = divisoes.some(d => d.id === divisaoInformada)
  ? divisaoInformada
  : divisoes[0].id;

function montarMenu(){
  const menu = document.getElementById("menu-divisoes");
  menu.innerHTML = divisoes.map(d =>
    `<li><a href="#" data-id="${d.id}" class="${d.id===divisaoAtual?'ativa':''}" onclick="trocarDivisao(event,'${d.id}')">${d.nome}</a></li>`
  ).join("");
}

function trocarDivisao(e, id){
  e.preventDefault();
  divisaoAtual = id;
  window.history.replaceState(null, "", `?divisao=${id}`);
  document.getElementById("txBusca").value = "";
  montarMenu();
  renderizarClubes();
}

function renderizarClubes(){
  const divisao = divisoes.find(d => d.id === divisaoAtual);
  const container = document.getElementById("lista-times");
  const vazio = document.getElementById("estado-vazio");
  const termo = document.getElementById("txBusca").value.trim().toLowerCase();

  const clubesFiltrados = divisao.clubes.filter(c => c.nome.toLowerCase().includes(termo));

  if(clubesFiltrados.length === 0){
    container.style.display = "none";
    vazio.style.display = "block";
    container.innerHTML = "";
    return;
  }

  container.style.display = "grid";
  vazio.style.display = "none";
  container.innerHTML = clubesFiltrados.map(c => `
    <a href="${c.link || '#'}" class="time-caixa">
      <div class="escudo">
        ${c.escudo ? `<img src="${c.escudo}" alt="${c.nome}">` : 'ESCUDO'}
      </div>
      <div class="nome">${c.nome.toUpperCase()}</div>
    </a>
  `).join("");
}

function filtrarClubes(){
  renderizarClubes();
}

montarMenu();
renderizarClubes();
</script>
<script src="assets/site-aviso.js"></script>

</body>
</html>
